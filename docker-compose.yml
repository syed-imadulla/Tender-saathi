services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tendersaathi-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - REPORT_DIR=reports/generated
      - TENDERSAATHI_LLM_ENABLED=false
      - TENDERSAATHI_LLM_PROVIDER=groq
      - TENDERSAATHI_LLM_MODEL=openai/gpt-oss-120b
      # Optional: set GROQ_API_KEY in .env if testing LLM assist
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - reports_data:/app/reports/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tendersaathi-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reports_data:
